#
# ASTRA — development environment
#
# ─────────────────────────────────────────────────────────────────────────────
#  PROVISIONAL VALUES. NOT CERTIFIED. NOT EVIDENCE.
#
#  Every safety threshold below is a placeholder chosen so that the pipeline can
#  be executed during development. None of them is derived from a run, from the
#  source documents, or from any calibration exercise — the documents assign no
#  values to these parameters precisely because they can only be fixed
#  empirically (assumption A-4).
#
#  No number produced under this configuration may be reported as a result.
#  The configuration hash stamped on every decision record is what makes a run
#  under this file distinguishable from a certified one; that is the mechanism
#  that keeps a development number from being mistaken for evidence.
# ─────────────────────────────────────────────────────────────────────────────
#

schema_version = 1
environment = "development"

[estimation]
# Loose enough not to fire constantly on unturned filter parameters during
# bring-up. Tightened empirically in Phase 2 against ground truth.
innovation_gate_gamma = 9.0
# Process-noise diagonals Q_f and Q_s. PROVISIONAL: these are starting points
# for the Phase 2 tuning against ground truth, not tuned values. Order follows
# FAST_STATE_FIELDS = (px, py, v, psi, a_lat) and
# SLOW_STATE_FIELDS = (mu_road, delta_tyre, rho_sensor).
fast_process_noise = [0.05, 0.05, 0.10, 0.01, 0.50]
# Degradation parameters drift slowly, so their process noise is small.
slow_process_noise = [1e-5, 1e-6, 1e-5]

[trust]
# 95% nominal conformal coverage. A round number for development, not a
# certified operating point.
coverage_level = 0.95
# The urban/highway classification boundary. PROVISIONAL.
highway_speed_boundary_kmh = 50.0

[twin]
# PINN training and online-adaptation parameters. PROVISIONAL: none of these is
# derived from a trained model, because no corpus has been collected yet.
# How hard the physics residual is enforced relative to data fit. At 0 the twin
# is an ordinary regressor, which would forfeit the property that makes it worth
# calling physics-informed.
physics_weight = 1.0
# Measured 2 August 2026, not guessed. At the value this file used to carry --
# 150 -- the penalty was bit-for-bit inert: 4,000 samples of a second context
# gave forgetting 0.038951 against 0.038972 unregularised, identical to four
# decimals. The cause was not the number but the anchor, which `_consolidate`
# re-took after every buffer flush; with it held across a context (ADR-0018) the
# response is monotone from 1e2 to 1e8. 1e4 sits in the middle of that range, so
# being wrong by an order of magnitude either way still leaves a working penalty
# -- which is the property the old value most conspicuously lacked.
#
# Known and tracked as P3.1a: at every lambda the ratio of forgetting to
# adaptation is constant, so this is a brake rather than a consolidator. See
# tests/unit/test_l5_forgetting.py.
ewc_lambda = 10000.0
# Row mapping a command vector to the lateral acceleration it produces, in the
# actuation space's channel order. A platform fact, configured rather than coded
# so the core stays domain-independent (NFR5). This development space is
# (throttle, brake, steer), so only steering contributes lateral acceleration.
# The linearisation ignores the v^2 term and is a bring-up placeholder only.
control_effectiveness = [0.0, 0.0, 120.0]
seed = 20260730

[gate]
significance_epsilon = 0.05
mmd_threshold = 0.10
# Applied to epsilon when covariate shift is declared. Above 1 on purpose: a
# smaller epsilon raises the conformal quantile and widens the acceptance
# region, so multiplying below 1 would loosen the gate under shift. PROVISIONAL.
shift_epsilon_multiplier = 2.0

[physical]
# L7b's two rate bounds. PROVISIONAL. Both are deliberately rate limits, not
# magnitude limits — a magnitude bound here would duplicate the shield and
# collapse two of the three gates into one while both kept reporting verdicts.
# Lateral jerk a tyre and suspension can actually transmit. Human comfort limits
# are around 2 m/s^3; the physical limit is higher, and this is set loose enough
# for bring-up not to fire on ordinary manoeuvres.
max_lateral_jerk_mps3 = 12.0
# How far the proposal's implied lateral acceleration may sit from the twin's
# before the model and the proposer are judged to disagree about the vehicle.
admissible_divergence_mps2 = 4.0

[shield]
# Urban default. The shield's bounds are hard limits, so even in development
# they are set to physically defensible values rather than permissive ones —
# a shield that never fires teaches nothing during bring-up.
legal_speed_limit_kmh = 50.0
friction_margin = 0.85
minimum_stopping_distance_m = 2.0
# d_avail: the clear distance ahead the ODD assures. PROVISIONAL.
assured_clear_distance_m = 60.0
lateral_corridor_half_width_m = 1.75

[failsafe]
# Deliberately small so that state transitions are reachable in short
# development runs and the FSM can be exercised by hand.
#
# As durations at 20 Hz these are 0.15 s, 0.3 s and 0.5 s -- far too twitchy to
# run anything against, which is the point: they exist to make the graduated
# response easy to trigger, not to describe a defensible operating point. Do not
# read them as a model for `simulation.toml`, whose values are chosen as
# durations and explained there.
ood_threshold_degraded = 3
ood_threshold_limp = 6
ood_threshold_halt = 10
degraded_speed_cap_kmh = 40.0
limp_speed_cap_kmh = 20.0

[arbitration]
trust_threshold_tau = 0.60
divergence_limit_delta = 0.25

[observability]
log_level = "DEBUG"

#
# ASTRA — simulation environment
#
# ─────────────────────────────────────────────────────────────────────────────
#  PROVISIONAL VALUES. NOT CERTIFIED. NOT EVIDENCE.
#
#  The operating point used for simulator runs and the validation scenarios.
#  As with `development.toml`, every safety threshold here is a placeholder
#  pending empirical determination (assumption A-4). Numbers produced under this
#  file are simulation measurements and must always be reported as such — the
#  honesty boundaries require the software/hardware and simulated/real
#  distinctions to be stated explicitly every time a figure is quoted.
# ─────────────────────────────────────────────────────────────────────────────
#

schema_version = 1
environment = "simulation"

[estimation]
# The prototype runs the slow filter at 0.1 Hz rather than the 1 Hz deployment
# rate (finding R-5): a simulated run is too short for a 1 Hz filter to
# accumulate a meaningful degradation estimate.
slow_rate_hz = 0.1
innovation_gate_gamma = 7.5
# PROVISIONAL, as in development.toml. Highway motion is smoother than urban,
# so the positional process noise is tighter here.
fast_process_noise = [0.02, 0.02, 0.05, 0.005, 0.30]
slow_process_noise = [1e-5, 1e-6, 1e-5]

[trust]
coverage_level = 0.95
# The urban/highway classification boundary. PROVISIONAL.
highway_speed_boundary_kmh = 70.0

[twin]
# PROVISIONAL, as in development.toml. Highway motion is smoother, so the
# physics residual can be weighted a little harder without fighting the data.
physics_weight = 1.5
# (throttle, brake, steer) for the simulated platform. Placeholder pending a
# trained twin and a measured steering-to-lateral-acceleration response.
control_effectiveness = [0.0, 0.0, 140.0]
seed = 20260730

[gate]
significance_epsilon = 0.05
mmd_threshold = 0.08
# See development.toml: above 1 tightens the gate, below 1 would loosen it.
shift_epsilon_multiplier = 2.5

[physical]
# PROVISIONAL. Highway manoeuvres are smoother than urban ones, so both bounds
# are tighter here than in development.
max_lateral_jerk_mps3 = 8.0
admissible_divergence_mps2 = 3.0

[shield]
# Highway operating point, matching the first phase of the validation drive.
legal_speed_limit_kmh = 120.0
friction_margin = 0.80
minimum_stopping_distance_m = 5.0
# d_avail: the clear distance ahead the ODD assures. PROVISIONAL.
assured_clear_distance_m = 150.0
# How far off the centreline the vehicle may be. Matches the training plant's
# lane half-width. Not called a lane: NFR5 keeps road concepts out of the core,
# and a warehouse AGV has a permitted corridor just as a car has a lane.
lateral_corridor_half_width_m = 1.75

[failsafe]
# The out-of-distribution counter increments on a VETO and decrements on a PASS,
# so a threshold is a duration of *sustained* refusal divided by the tick period.
# At fast_rate_hz = 20 these are 0.5 s, 1.5 s and 5.0 s.
#
# They were 5 / 12 / 20 until 2 August 2026 -- 0.25 s, 0.6 s and 1.0 s. Nobody
# had converted them, and one second turned out to be shorter than a legitimate
# recovery: a vehicle starting 1 m off the lane centre needs about 21 ticks to
# correct, because L7b's jerk bound permits 0.4 m/s^2 of lateral acceleration per
# tick and L9 rate-limits the approach (ADR-0017). Every one of those ticks is a
# VETO. So a 100,000-tick run in which the vehicle held the lane to 0.0003 m
# spent 99,000 ticks in HALT, entered during the first second and terminal
# thereafter.
#
# Chosen as durations rather than counts, and the question they answer is: how
# long should a system whose thesis is that stopping is the hazard tolerate
# sustained refusal before giving up? One second is not it.
ood_threshold_degraded = 10
ood_threshold_limp = 30
ood_threshold_halt = 100
degraded_speed_cap_kmh = 60.0
limp_speed_cap_kmh = 20.0

# The sensor-integrity counter (ADR-0024) rises on any modality worse than
# HEALTHY and falls on a clean frame. It answers a different question from the
# OOD counter and gets its own, much tighter, thresholds: 0.25 s, 0.75 s and
# 2.0 s at 20 Hz.
#
# The looser triple above has a floor set by a *legitimate* recovery -- a
# vehicle 1 m off centre needs ~21 vetoed ticks to correct. There is no
# legitimate reason for a modality to stop publishing, so this triple has no
# such floor and is bounded from the other side instead: by the hazard.
#
# Measured (E-46): under a 200-tick IMU dropout, L1 reports the IMU DEGRADED
# from the second tick and the vehicle first crosses its +/-1.75 m corridor at
# tick +73. So every threshold here must land inside 73, and phi3 = 40 leaves a
# 33-tick margin -- 1.65 s at 20 Hz -- between a commanded stop and the hazard.
#
# Do not tune these to catch the six faults in benchmarks/fault_study.py. They
# are six faults chosen by hand to defeat six named defences, not a population;
# a threshold fitted to them is fitted to its own test set, which is the defect
# E-41 records for the conformal corpus.
integrity_threshold_degraded = 5
integrity_threshold_limp = 15
integrity_threshold_halt = 40

[arbitration]
trust_threshold_tau = 0.70
divergence_limit_delta = 0.20

[observability]
log_level = "INFO"
# Simulation runs are the source of the evidence pack, so records are synced as
# they are written: a crashed run must not lose the ticks that preceded it.
fsync_each_record = true

#
# ASTRA — certification environment
#
# ─────────────────────────────────────────────────────────────────────────────
#  THIS FILE IS INCOMPLETE BY DESIGN. LOADING IT WILL FAIL UNTIL A SAFETY
#  ENGINEER SUPPLIES THE VALUES BELOW.
#
#  Every safety threshold is commented out rather than pre-filled. That is
#  deliberate and is the single most important property of this file.
#
#  A certification configuration that shipped with plausible-looking numbers
#  would let a certification run proceed under thresholds that nobody chose and
#  nobody signed off, and the resulting figures would enter a report carrying
#  the authority of a certified run. Assumption A-4 states that these parameters
#  have no defensible default; this file is where that assumption is enforced
#  rather than merely recorded.
#
#  Attempting to load this environment as shipped raises a ConfigurationError
#  naming every missing field. Verify with:
#
#      astra config show --environment certification
#
#  That failure is the expected behaviour and is exercised by the test suite.
#
#  ── To complete this file ───────────────────────────────────────────────────
#  Uncomment each parameter and record, in the commit message or an
#  accompanying record: the value chosen, the runs or analysis it was derived
#  from, and who approved it. A value here without that provenance is not a
#  certified value, whatever this file says.
# ─────────────────────────────────────────────────────────────────────────────
#

schema_version = 1
environment = "certification"

[estimation]
# Mahalanobis threshold above which the innovation monitor raises a sensor
# fault. Derive from the innovation distribution measured over the certification
# corpus; state the false-positive rate accepted.
# innovation_gate_gamma =
# Process-noise diagonals. Q governs how fast the filter trusts measurements
# over its own model, so it sets the state estimate all three gates read.
# Derive from the tuning runs against ground truth and record the corpus used.
# fast_process_noise =
# slow_process_noise =

[trust]
# Conformal coverage 1 − ε targeted by the Trust Module. Must be justified
# against the per-class empirical coverage actually achieved, not assumed.
# coverage_level =
# The urban/highway classification boundary. An ODD definition: it decides which
# certified population a tick's conformal quantile is drawn from.
# highway_speed_boundary_kmh =

[twin]
# The twin's prediction is the right operand of the non-conformity score, so
# these shape a gate input rather than a diagnostic.
# Weight on the physics residual during training. Derive from the trained twin's
# validation error against held-out dynamics; record the corpus and the split.
# physics_weight =
# There is deliberately no EWC penalty to set. ADR-0019 replaced it with one
# output head per ContextClass, so forgetting is prevented by the shape of the
# network rather than by a term whose strength has to be certified. RK-5's
# catastrophic-forgetting requirement is still what must be demonstrated; the
# test is tests/unit/test_l5_forgetting.py.
# Row mapping a command vector to the lateral acceleration it produces, in the
# actuation space's channel order. A certified platform characterisation, not a
# tuning parameter -- derive from the vehicle's steering response measurement.
# control_effectiveness =

[gate]
# Conformal significance level ε, and the MMD value above which covariate shift
# is declared and ε is tightened.
# significance_epsilon =
# mmd_threshold =
# Factor applied to epsilon once shift is declared. Must be at least 1. The
# acceptance region is {score <= q_{1-epsilon}}, so a smaller epsilon raises the
# quantile and widens the region: a value below 1 would loosen the gate at
# exactly the moment the world stopped matching the calibration data, and
# nothing would raise, because coverage would still hold at the weaker level.
# shift_epsilon_multiplier =

[physical]
# L7b's two rate bounds. Both are platform characterisations, not tuning
# parameters, and both must be rate limits: a magnitude bound here would
# duplicate the shield and merge two of the three gates while leaving both
# still reporting verdicts.
# Largest lateral jerk the tyres and suspension can transmit. Derive from the
# platform's suspension and tyre characterisation.
# max_lateral_jerk_mps3 =
# Largest admissible disagreement, in m/s^2, between the lateral acceleration
# the proposal implies and the one the twin predicts. Derive from the trained
# twin's validation error against held-out dynamics; this is the term through
# which twin drift becomes this gate's failure mode.
# admissible_divergence_mps2 =

[shield]
# The three hard bounds. These are legal and physical limits for the certified
# operational design domain, not tuning parameters; they must come from the ODD
# definition and the vehicle's braking characterisation.
# legal_speed_limit_kmh =
# friction_margin =
# minimum_stopping_distance_m =
# d_avail: the clear distance ahead the ODD guarantees. A certified ODD
# parameter, not a perception output -- see the schema docstring.
# assured_clear_distance_m =
# lateral_corridor_half_width_m =

[failsafe]
# θ1 < θ2 < θ3. Must be strictly increasing — the schema enforces the ordering,
# because out-of-order thresholds would make a state unreachable and silently
# remove a step from the graduated response.
# ood_threshold_degraded =
# ood_threshold_limp =
# ood_threshold_halt =
# degraded_speed_cap_kmh =
# limp_speed_cap_kmh =
#
# The sensor-integrity thresholds (ADR-0024) are safety thresholds by the same
# argument and are equally absent. phi1 < phi2 < phi3, and the deployment must
# choose them against its own hazard: the question is how long a modality may
# say nothing before the vehicle stops, and the answer depends on how fast the
# vehicle departs when it does. The prototype's simulation profile derives them
# from a measured 73-tick departure; a real vehicle has a different number and
# it is the integrator's to measure, not this repository's to assume.
# integrity_threshold_degraded =
# integrity_threshold_limp =
# integrity_threshold_halt =
#
# And how many modalities may be unhealthy at once before the counter rises.
# Zero unless the sensor set carries enough independent measurements of each
# quantity to keep working with one of them lying, AND something excludes the
# liar from the fusion. Both halves are required; either alone is not
# redundancy (ADR-0027).
# integrity_tolerated_faults =
#
# And which modalities' health may change the posture at all. Naming a modality
# non-critical asserts that nothing the safety argument depends on reads it --
# get it wrong and the vehicle drives on a dead sensor it needed. A modality
# left out is still recorded; it stops being a reason to act (ADR-0028).
# critical_modalities =

[arbitration]
# τ, the calibration admissibility threshold, and δ_CDI, the divergence limit
# above which a staged calibration switch rolls back.
# trust_threshold_tau =
# divergence_limit_delta =

[observability]
log_level = "INFO"
# Certification evidence must survive an abnormal termination.
fsync_each_record = true
